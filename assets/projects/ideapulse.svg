<svg viewBox="0 0 580 250" fill="none" xmlns="http://www.w3.org/2000/svg"
     font-family="'Segoe UI', system-ui, Helvetica, Arial, sans-serif">
  <title>IdeaPulse — Capture, refine, and validate startup ideas — turning raw sparks into ranked, actionable concepts.</title>
  <defs>
    <linearGradient id="glassideapulse" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17140E"/><stop offset="1" stop-color="#100E0A"/></linearGradient>
    <linearGradient id="tileideapulse" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBEBB0"/><stop offset="0.55" stop-color="#E8C25A"/><stop offset="1" stop-color="#C89B32"/></linearGradient>
  </defs>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.10s" fill="freeze"/>
    <rect x="2" y="2" width="576" height="246" rx="16" fill="url(#glassideapulse)" stroke="#E8C25A" stroke-opacity="0.14"/>
    <rect x="2" y="20" width="4" height="210" rx="2" fill="#E0A23A"/>
    <rect x="22" y="22" width="32" height="32" rx="9" fill="url(#tileideapulse)"/>
    <text x="38" y="45" text-anchor="middle" font-size="18" font-weight="800" fill="#17130A">I</text>
    <text x="66" y="45" font-size="20" font-weight="700" fill="#E8C25A">IdeaPulse</text>
    <g transform="translate(451 22)">
      <rect width="107" height="24" rx="12" fill="none" stroke="#E0A23A" stroke-opacity="0.6"/>
      <circle cx="17" cy="12" r="3.5" fill="#E0A23A"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="30" y="16" font-size="10.5" letter-spacing="1" fill="#E0A23A" font-family="monospace">IN PROGRESS</text>
    </g>
    <text x="24" y="90" font-size="13.5" fill="#B8B0A0">Capture, refine, and validate startup ideas — turning raw</text>
    <text x="24" y="110" font-size="13.5" fill="#B8B0A0">sparks into ranked, actionable concepts.</text>
    <g font-size="12.5" fill="#DED6C2">
      <rect x="22" y="140" width="71" height="26" rx="13" fill="#E8C25A" fill-opacity="0.06" stroke="#E8C25A" stroke-opacity="0.28"/><text x="57.5" y="157" text-anchor="middle">Next.js</text>
      <rect x="103" y="140" width="92" height="26" rx="13" fill="#E8C25A" fill-opacity="0.06" stroke="#E8C25A" stroke-opacity="0.28"/><text x="149" y="157" text-anchor="middle">TypeScript</text>
      <rect x="205" y="140" width="78" height="26" rx="13" fill="#E8C25A" fill-opacity="0.06" stroke="#E8C25A" stroke-opacity="0.28"/><text x="244" y="157" text-anchor="middle">Supabase</text>
      <rect x="293" y="140" width="64" height="26" rx="13" fill="#E8C25A" fill-opacity="0.06" stroke="#E8C25A" stroke-opacity="0.28"/><text x="325" y="157" text-anchor="middle">OpenAI</text>
    </g>
    <rect x="22" y="192" width="536" height="1" fill="#E8C25A" fill-opacity="0.08"/>
    <text x="22" y="222" font-size="13" font-weight="600" fill="#E8C25A" font-family="monospace">❯ view repository</text>
    <text x="558" y="222" text-anchor="end" font-size="12" fill="#8C846F" font-family="monospace">ThiruVishagan10/ideapulse ↗</text>
  </g>
</svg>
