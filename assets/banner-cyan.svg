<svg viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, Helvetica, Arial, sans-serif">
  <title>PROJECT SELENE — Vishagan · Software Engineer</title>

  <!-- ══════════════════════ DEFS ══════════════════════ -->
  <defs>
    <linearGradient id="titleGrad" x1="300" y1="180" x2="820" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#00E5FF"/>
      <stop offset="0.55" stop-color="#7DD3FC"/>
      <stop offset="1"   stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="1"   stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="topglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#00E5FF" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#8B5CF6" stop-opacity="0.06"/>
      <stop offset="1"   stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGrad" cx="0.42" cy="0.40" r="0.62">
      <stop offset="0"    stop-color="#BAF3FF"/>
      <stop offset="0.35" stop-color="#00E5FF"/>
      <stop offset="0.75" stop-color="#8B5CF6"/>
      <stop offset="1"    stop-color="#3B1D74"/>
    </radialGradient>
    <radialGradient id="coreHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="1"    stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <!-- typing reveal clip: type-in, hold, delete every 4s -->
    <clipPath id="type">
      <rect x="340" y="240" height="46" width="0">
        <animate attributeName="width" values="0;520;520;0" keyTimes="0;0.30;0.80;1" dur="4s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- ══════════════════════ BACKDROP ══════════════════════ -->
  <rect width="1200" height="420" fill="#0D1117"/>
  <ellipse cx="560" cy="-30" rx="720" ry="300" fill="url(#topglow)"/>

  <!-- drifting grid (translates one cell to loop seamlessly) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-40 -40;0 0" dur="14s" repeatCount="indefinite"/>
    <rect x="-40" y="-40" width="1280" height="500" fill="url(#grid)"/>
  </g>

  <!-- diagonal light sweep -->
  <g opacity="0.14">
    <rect x="-320" y="-80" width="260" height="580" fill="url(#sweep)" transform="skewX(-18)">
      <animate attributeName="x" values="-320;1320" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- floating particles -->
  <g fill="#00E5FF">
    <circle cx="120" cy="360" r="1.8"><animate attributeName="cy" values="360;120" dur="9s" begin="0s"   repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="9s" begin="0s"   repeatCount="indefinite"/></circle>
    <circle cx="220" cy="380" r="1.4"><animate attributeName="cy" values="380;140" dur="11s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="11s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="70"  cy="340" r="1.2"><animate attributeName="cy" values="340;90"  dur="8s"  begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="8s"  begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="370" r="2.0" fill="#8B5CF6"><animate attributeName="cy" values="370;150" dur="12s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="12s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="390" r="1.5"><animate attributeName="cy" values="390;110" dur="10s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="360" r="1.3" fill="#8B5CF6"><animate attributeName="cy" values="360;120" dur="9.5s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9.5s" begin="-5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="385" r="1.7"><animate attributeName="cy" values="385;150" dur="11.5s" begin="-2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="11.5s" begin="-2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="370" r="1.4"><animate attributeName="cy" values="370;140" dur="10.5s" begin="-6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="10.5s" begin="-6s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="390" r="1.9" fill="#8B5CF6"><animate attributeName="cy" values="390;160" dur="13s" begin="-4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.85;0" dur="13s" begin="-4.5s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="380" r="1.2"><animate attributeName="cy" values="380;130" dur="8.5s" begin="-7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="8.5s" begin="-7s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="375" r="1.6"><animate attributeName="cy" values="375;120" dur="12.5s" begin="-3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="12.5s" begin="-3.5s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="360" r="1.3"><animate attributeName="cy" values="360;110" dur="9s" begin="-8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="-8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ══════════════════════ ORBITAL AI CORE (right) ══════════════════════ -->
  <g transform="translate(980 205)">
    <circle r="150" fill="url(#coreHalo)"/>
    <!-- static concentric rings -->
    <circle r="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <circle r="82"  fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
    <!-- rotating dashed ring -->
    <circle r="112" fill="none" stroke="#00E5FF" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="4 14">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle r="82" fill="none" stroke="#8B5CF6" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="2 10">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <!-- the moon / core -->
    <circle r="46" fill="url(#moonGrad)" filter="url(#glowSoft)" opacity="0.9"/>
    <circle r="46" fill="url(#moonGrad)"/>
    <circle r="46" fill="none" stroke="#BAF3FF" stroke-opacity="0.6" stroke-width="1"/>
    <!-- crescent shadow for a subtle moon feel -->
    <circle cx="16" cy="-8" r="42" fill="#0D1117" opacity="0.28"/>
    <!-- core pulse -->
    <circle r="46" fill="none" stroke="#00E5FF" stroke-width="1.5">
      <animate attributeName="r" values="46;70;46" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <!-- orbiting satellite on the outer ring -->
    <circle r="3.5" fill="#00E5FF" filter="url(#glow)">
      <animateMotion dur="22s" repeatCount="indefinite" path="M0,-112 A112,112 0 1,1 -0.01,-112 Z"/>
    </circle>
    <circle r="2.5" fill="#8B5CF6" filter="url(#glow)">
      <animateMotion dur="16s" repeatCount="indefinite" keyPoints="0.5;1.5" keyTimes="0;1" calcMode="linear" path="M0,-82 A82,82 0 1,1 -0.01,-82 Z"/>
    </circle>
  </g>

  <!-- ══════════════════════ CONTENT COLUMN (left) ══════════════════════ -->
  <!-- left accent bar -->
  <rect x="312" y="128" width="4" height="206" rx="2" fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- status chip -->
  <g>
    <rect x="340" y="134" width="196" height="26" rx="13" fill="#161B22" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <circle cx="357" cy="147" r="4" fill="#34D399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="372" y="151" font-size="12" letter-spacing="2" fill="#94A3B8" font-family="'SF Mono','JetBrains Mono',Consolas,monospace">SYSTEM ONLINE</text>
  </g>

  <!-- title -->
  <text x="338" y="222" font-size="62" font-weight="700" letter-spacing="1" fill="url(#titleGrad)" filter="url(#glow)">
    PROJECT SELENE
    <animate attributeName="opacity" values="0.85;1;0.85" dur="5s" repeatCount="indefinite"/>
  </text>

  <!-- typing headline (mono) : type → hold → delete, cursor appears when line complete -->
  <g font-family="'SF Mono','JetBrains Mono',Consolas,monospace" font-size="34" font-weight="600" fill="#00E5FF">
    <g clip-path="url(#type)">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.2;0.2;1" dur="20s" repeatCount="indefinite"/>
      <text x="340" y="274">SOFTWARE ENGINEER</text>
      <rect x="688" y="246" width="4" height="32" fill="#00E5FF"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="0.9s" repeatCount="indefinite"/></rect>
    </g>
    <g clip-path="url(#type)">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.2;0.4;0.4;1" dur="20s" repeatCount="indefinite"/>
      <text x="340" y="274">BACKEND ENGINEER</text>
      <rect x="668" y="246" width="4" height="32" fill="#00E5FF"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="0.9s" repeatCount="indefinite"/></rect>
    </g>
    <g clip-path="url(#type)">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.4;0.6;0.6;1" dur="20s" repeatCount="indefinite"/>
      <text x="340" y="274">GO</text>
      <rect x="384" y="246" width="4" height="32" fill="#00E5FF"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="0.9s" repeatCount="indefinite"/></rect>
    </g>
    <g clip-path="url(#type)">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.6;0.8;0.8;1" dur="20s" repeatCount="indefinite"/>
      <text x="340" y="274">CLOUD</text>
      <rect x="444" y="246" width="4" height="32" fill="#00E5FF"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="0.9s" repeatCount="indefinite"/></rect>
    </g>
    <g clip-path="url(#type)">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.8;1" dur="20s" repeatCount="indefinite"/>
      <text x="340" y="274">ARTIFICIAL INTELLIGENCE</text>
      <rect x="812" y="246" width="4" height="32" fill="#00E5FF"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="0.9s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- subtitle -->
  <text x="341" y="320" font-size="19" fill="#94A3B8" font-family="'Segoe UI', system-ui, Helvetica, Arial, sans-serif">
    Building scalable products that solve real problems.
  </text>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="0" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
</svg>
