<svg viewBox="0 0 1200 676" fill="none" xmlns="http://www.w3.org/2000/svg"
     font-family="'Segoe UI', system-ui, Helvetica, Arial, sans-serif">
  <title>Tech Stack — Backend · Frontend · Cloud · Databases · AI · Tools</title>

  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17140E"/>
      <stop offset="1" stop-color="#100E0A"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBEBB0"/>
      <stop offset="0.55" stop-color="#E8C25A"/>
      <stop offset="1" stop-color="#C89B32"/>
    </linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- ═══ reusable symbols: tile+label handled inline per item ═══ -->
  <!-- panel style is repeated per <g>; each category is one self-contained block -->

  <!-- ░░░░░░░░ 01 · BACKEND ░░░░░░░░ -->
  <g opacity="0" transform="translate(20 20)">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.10s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="20 34" to="20 20" dur="0.6s" begin="0.10s" fill="freeze"/>
    <rect width="568" height="196" rx="16" fill="url(#glass)" stroke="#E8C25A" stroke-opacity="0.14"/>
    <text x="544" y="32" text-anchor="end" font-family="monospace" font-size="13" fill="#E8C25A" fill-opacity="0.35">01</text>
    <rect x="24" y="22" width="30" height="20" rx="7" fill="url(#tile)" filter="url(#g)" opacity="0.5" transform="translate(0 5)"/>
    <rect x="24" y="20" width="30" height="30" rx="8" fill="url(#tile)"/>
    <text x="39" y="41" text-anchor="middle" font-size="16" font-weight="800" fill="#17130A">B</text>
    <text x="66" y="41" font-size="17" font-weight="700" letter-spacing="2" fill="#E8C25A">BACKEND</text>
    <rect x="24" y="60" width="520" height="1" fill="#E8C25A" fill-opacity="0.10"/>
    <!-- items -->
    <g transform="translate(28 78)"><rect width="30" height="30" rx="8" fill="url(#tile)"/><text x="15" y="19" text-anchor="middle" font-family="monospace" font-size="12" font-weight="800" fill="#17130A">Go</text></g><text x="68" y="98" font-size="14.5" fill="#DED6C2">Go</text>
    <g transform="translate(208 78)"><rect width="30" height="30" rx="8" fill="url(#tile)"/><text x="15" y="19" text-anchor="middle" font-family="monospace" font-size="12" font-weight="800" fill="#17130A">Nd</text></g><text x="248" y="98" font-size="14.5" fill="#DED6C2">Node.js</text>
    <g transform="translate(388 78)"><rect width="30" height="30" rx="8" fill="url(#tile)"/><text x="15" y="19" text-anchor="middle" font-family="monospace" font-size="12" font-weight="800" fill="#17130A">Ex</text></g><text x="428" y="98" font-size="14.5" fill="#DED6C2">Express</text>
    <g transform="translate(28 122)"><rect width="30" height="30" rx="8" fill="url(#tile)"/><text x="15" y="19" text-anchor="middle" font-family="monospace" font-size="12" font-weight="800" fill="#17130A">Re</text></g><text x="68" y="142" font-size="14.5" fill="#DED6C2">REST</text>
    <g transform="translate(208 122)"><rect width="30" height="30" rx="8" fill="url(#tile)"/><text x="15" y="19" text-anchor="middle" font-family="monospace" font-size="12" font-weight="800" fill="#17130A">GQ</text></g><text x="248" y="142" font-size="14.5" fill="#DED6C2">GraphQL</text>
