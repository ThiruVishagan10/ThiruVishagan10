    <g transform="translate(28 78)"><rect width="30" height="30" rx="8" fill="url(#tile)"/><text x="15" y="19" text-anchor="middle" font-family="monospace" font-size="12" font-weight="800" fill="#17130A">Oa</text></g><text x="68" y="98" font-size="14.5" fill="#DED6C2">OpenAI</text>
    <g transform="translate(208 78)"><rect width="30" height="30" rx="8" fill="url(#tile)"/><text x="15" y="19" text-anchor="middle" font-family="monospace" font-size="12" font-weight="800" fill="#17130A">Gm</text></g><text x="248" y="98" font-size="14.5" fill="#DED6C2">Gemini</text>
    <g transform="translate(388 78)"><rect width="30" height="30" rx="8" fill="url(#tile)"/><text x="15" y="19" text-anchor="middle" font-family="monospace" font-size="12" font-weight="800" fill="#17130A">Py</text></g><text x="428" y="98" font-size="14.5" fill="#DED6C2">Python</text>
    <text x="28" y="150" font-size="12.5" font-style="italic" fill="#8C846F">// building AI-powered product features</text>
  </g>

