    <g transform="translate(208 78)"><rect width="30" height="30" rx="8" fill="url(#tile)"/><text x="15" y="19" text-anchor="middle" font-family="monospace" font-size="12" font-weight="800" fill="#17130A">TS</text></g><text x="248" y="98" font-size="14.5" fill="#DED6C2">TypeScript</text>
    <g transform="translate(388 78)"><rect width="30" height="30" rx="8" fill="url(#tile)"/><text x="15" y="19" text-anchor="middle" font-family="monospace" font-size="12" font-weight="800" fill="#17130A">Rc</text></g><text x="428" y="98" font-size="14.5" fill="#DED6C2">React</text>
    <g transform="translate(28 122)"><rect width="30" height="30" rx="8" fill="url(#tile)"/><text x="15" y="19" text-anchor="middle" font-family="monospace" font-size="12" font-weight="800" fill="#17130A">Nx</text></g><text x="68" y="142" font-size="14.5" fill="#DED6C2">Next.js</text>
    <g transform="translate(208 122)"><rect width="30" height="30" rx="8" fill="url(#tile)"/><text x="15" y="19" text-anchor="middle" font-family="monospace" font-size="12" font-weight="800" fill="#17130A">Tw</text></g><text x="248" y="142" font-size="14.5" fill="#DED6C2">Tailwind</text>
  </g>

