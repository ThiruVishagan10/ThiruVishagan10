    <g transform="translate(208 78)"><rect width="30" height="30" rx="8" fill="url(#tile)"/><text x="15" y="19" text-anchor="middle" font-family="monospace" font-size="12" font-weight="800" fill="#17130A">Mo</text></g><text x="248" y="98" font-size="14.5" fill="#DED6C2">MongoDB</text>
    <g transform="translate(388 78)"><rect width="30" height="30" rx="8" fill="url(#tile)"/><text x="15" y="19" text-anchor="middle" font-family="monospace" font-size="10" font-weight="800" fill="#17130A">SQL</text></g><text x="428" y="98" font-size="14.5" fill="#DED6C2">SQL</text>
    <text x="28" y="150" font-size="12.5" font-style="italic" fill="#8C846F">// relational core, document when it fits</text>
  </g>

