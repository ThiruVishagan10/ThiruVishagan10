name: Build Profile

# Regenerates README.md + data-driven SVGs whenever you edit the config.
# Edit selene.config.json → push → this runs → commits the rebuilt profile.

on:
  push:
    branches: [main]
    paths:
      - 'selene.config.json'
      - 'scripts/build.mjs'
      - '.github/workflows/build-profile.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate profile
        run: node scripts/build.mjs

      - name: Commit regenerated files
        run: |
          git config user.name  "selene-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(selene): rebuild profile from config [skip ci]"
            git push
          fi
