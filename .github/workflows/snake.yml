name: Snake Animation

# Generates the contribution-eating snake as an SVG and pushes it to the
# `output` branch. The README embeds it from that branch's raw URL.
# Themed Black & Gold (color_snake + 5-level color_dots, dark → gold).

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%23E8C25A&color_dots=%230A0A0B,%233A2E10,%237A5E1A,%23C89B32,%23FBEBB0

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
